name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Supabase env is only needed at request time, so the build does not require secrets.
      - run: pnpm --filter @storynest/web build

  database:
    name: Migrations, RLS/RPC tests, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL server and contrib extensions (citext, pg_trgm, pgcrypto)
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a throwaway cluster and run supabase/tests
        run: pnpm db:verify
      - name: Generated types and contract are up to date
        run: pnpm db:types:check
